name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Bundle sizes
        run: |
          {
            echo '### Web bundle'
            echo '| file | raw | gzip | brotli |'
            echo '|---|---:|---:|---:|'
            for f in dist/assets/*.js dist/assets/*.css; do
              printf '| %s | %s | %s | %s |\n' "$(basename "$f")" "$(stat -c%s "$f")" \
                "$(stat -c%s "$f.gz" 2>/dev/null || echo -)" "$(stat -c%s "$f.br" 2>/dev/null || echo -)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  go:
    name: go (vet, test -race)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: true
      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: internal/webui/dist
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Build all binaries (static)
        env:
          CGO_ENABLED: "0"
        run: |
          for c in tusk redirector api worker; do
            go build -trimpath -ldflags '-s -w' -o bin/$c ./cmd/$c
          done
          ls -la bin

  docker:
    name: docker build (no push)
    needs: [web, go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tusk:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image contents
        run: |
          docker image inspect tusk:ci --format '{{.Size}} bytes, entrypoint {{.Config.Entrypoint}}'
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          DB_PASSWORD=x docker compose -f docker-compose.postgres.yml config -q
          DB_PASSWORD=x docker compose -f docker-compose.mariadb.yml config -q
          cp deploy/.env.example deploy/.env && sed -i 's/^CF_DNS_API_TOKEN=$/CF_DNS_API_TOKEN=ci/' deploy/.env
          docker compose -f deploy/docker-compose.scale.yml --env-file deploy/.env config -q
