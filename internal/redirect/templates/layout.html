{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}} | {{.SiteName}}</title>
<link rel="icon" href="/images/favicon-32x32.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fafafa;color:#18181b;min-height:100vh;display:flex;flex-direction:column}
header{padding:1rem 1.5rem}header a{font-weight:700;color:inherit;text-decoration:none;font-size:1.25rem}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{background:#fff;border:1px solid #e4e4e7;border-radius:.75rem;padding:2rem;max-width:32rem;width:100%;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h1{font-size:1.4rem;margin:0 0 .5rem}p{color:#52525b;line-height:1.5;margin:.25rem 0 1rem}
label{display:block;font-size:.875rem;font-weight:500;margin-bottom:.35rem}
input{width:100%;padding:.6rem .75rem;border:1px solid #d4d4d8;border-radius:.5rem;font-size:1rem}
button{margin-top:1rem;width:100%;padding:.65rem;border:0;border-radius:.5rem;background:#18181b;color:#fff;font-size:1rem;font-weight:500;cursor:pointer}
button:disabled{opacity:.6}.error{color:#dc2626;font-size:.875rem;margin-top:.75rem}.success{color:#16a34a}
a.back{color:#18181b;font-weight:500}code{word-break:break-all;background:#f4f4f5;padding:.15rem .35rem;border-radius:.25rem}
@media (prefers-color-scheme:dark){body{background:#09090b;color:#fafafa}.card{background:#18181b;border-color:#27272a}p{color:#a1a1aa}input{background:#09090b;color:#fafafa;border-color:#3f3f46}button{background:#fafafa;color:#18181b}a.back{color:#fafafa}code{background:#27272a}}
</style>
<link rel="stylesheet" href="/css/custom.css" onerror="this.remove()">
</head>
<body>
<header><a href="/">{{.SiteName}}</a></header>
<main><div class="card">
{{end}}
{{define "foot"}}</div></main>
</body>
</html>
{{end}}
