# Tusk all-in-one with MariaDB + Redis (mirrors Kutt's docker-compose.mariadb.yml).
#
#   DB_NAME=kutt DB_USER=kutt DB_PASSWORD=change-me JWT_SECRET=... \
#     docker compose -f docker-compose.mariadb.yml up -d
services:
  server:
    build:
      context: .
    image: tusk:latest
    restart: unless-stopped
    volumes:
      - custom:/kutt/custom
    environment:
      DB_CLIENT: mysql2
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-kutt}
      DB_USER: ${DB_USER:-kutt}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-}
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:-localhost:3000}
    env_file:
      - path: .env
        required: false
    ports:
      - 3000:3000
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
  mariadb:
    image: mariadb:11
    restart: always
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 10
      start_period: 30s
    volumes:
      - db_data_mariadb:/var/lib/mysql
    environment:
      MARIADB_DATABASE: ${DB_NAME:-kutt}
      MARIADB_USER: ${DB_USER:-kutt}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    expose:
      - 3306
  redis:
    image: redis:7-alpine
    restart: always
    expose:
      - 6379
volumes:
  db_data_mariadb:
  custom:
