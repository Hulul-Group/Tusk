# Tusk all-in-one with PostgreSQL + Redis (mirrors Kutt's docker-compose.postgres.yml).
#
#   DB_NAME=kutt DB_USER=kutt DB_PASSWORD=change-me JWT_SECRET=... \
#     docker compose -f docker-compose.postgres.yml up -d
services:
  server:
    build:
      context: .
    image: tusk:latest
    restart: unless-stopped
    volumes:
      - custom:/kutt/custom
    environment:
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-kutt}
      DB_USER: ${DB_USER:-kutt}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-}
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:-localhost:3000}
    env_file:
      - path: .env
        required: false
    ports:
      - 3000:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  postgres:
    image: postgres:17-alpine
    restart: always
    volumes:
      - db_data_pg:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-kutt}
      POSTGRES_USER: ${DB_USER:-kutt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: always
    expose:
      - 6379
volumes:
  db_data_pg:
  custom:
